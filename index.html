<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Flipbook - Bookshelf</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 82px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
    }

    .panel {
      margin: 24px auto;
      padding: 24px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
    }

    .top-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    a.button,
    button {
      text-decoration: none;
      cursor: pointer;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    .bookshelf-title {
      font-size: 24px;
      color: #fff;
      text-shadow: 0 3px 0 #d95aa9, 0 0 18px #ff4fc3;
      margin: 8px 0 18px;
      text-align: center;
      letter-spacing: 3px;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      min-height: 220px;
      padding: 18px;
      border-radius: 24px;
      border: 3px solid #fff;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,182,230,0.75));
      box-shadow:
        0 12px 0 #d95aa9,
        0 0 22px rgba(255, 105, 210, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .book-cover {
      height: 116px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-title {
      font-size: 17px;
      color: #7a1456;
      font-weight: bold;
      word-break: break-word;
      line-height: 1.5;
    }

    .book-meta {
      font-size: 13px;
      color: #b13a86;
      margin-top: 6px;
    }

    .book-actions {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-button {
      padding: 9px 14px;
      font-size: 13px;
      box-shadow:
        0 4px 0 #d95aa9,
        0 0 12px rgba(255, 141, 221, 0.9);
    }

    .empty-shelf {
      text-align: center;
      padding: 38px 12px;
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.9;
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Pink Flipbook</h1>
      <p class="subtitle">画像を本みたいにストックできるY2K本棚</p>
    </header>

    <section class="panel">
      <div class="top-actions">
        <a class="button" href="create.html">＋ 新しい本を作る</a>
        <button id="clearAllButton" type="button">本棚を全部消す</button>
      </div>

      <h2 class="bookshelf-title">MY BOOKSHELF</h2>

      <div id="bookshelf" class="bookshelf"></div>

      <div id="emptyShelf" class="empty-shelf">
        まだ本がありません。<br />
        「＋ 新しい本を作る」から追加できます♡
      </div>
    </section>
  </main>

  <script>
    const bookshelf = document.getElementById("bookshelf");
    const emptyShelf = document.getElementById("emptyShelf");
    const clearAllButton = document.getElementById("clearAllButton");

    let books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];

    renderBookshelf();

    clearAllButton.addEventListener("click", () => {
      const ok = confirm("本棚を全部消しますか？");
      if (!ok) return;

      books = [];
      localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));
      renderBookshelf();
    });

    function renderBookshelf() {
      bookshelf.innerHTML = "";

      if (books.length === 0) {
        emptyShelf.style.display = "block";
        return;
      }

      emptyShelf.style.display = "none";

      books.forEach((book) => {
        const card = document.createElement("div");
        card.className = "book-card";

        const coverImage = book.images && book.images[0]
          ? '<img src="' + book.images[0] + '" alt="cover" />'
          : '<div>♡</div>';

        card.innerHTML = `
          <div>
            <div class="book-cover">
              ${coverImage}
            </div>
            <div class="book-title">${escapeHtml(book.title)}</div>
            <div class="book-meta">${book.images.length} pages</div>
            <div class="book-meta">${book.createdAt}</div>
          </div>

          <div class="book-actions">
            <a class="button small-button" href="book.html?id=${book.id}">開く</a>
            <button class="small-button" data-delete="${book.id}">消す</button>
          </div>
        `;

        bookshelf.appendChild(card);
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.getAttribute("data-delete");
          const ok = confirm("この本を消しますか？");
          if (!ok) return;

          books = books.filter((book) => book.id !== id);
          localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));
          renderBookshelf();
        });
      });
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
