<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Flipbook</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Arial", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    h1 {
      font-size: clamp(36px, 7vw, 76px);
      margin: 0;
      color: #fff;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 35px #fff;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 12px;
      font-weight: bold;
      color: #8c1d63;
    }

    .panel {
      width: min(1000px, 92vw);
      margin: 24px auto;
      padding: 24px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.45);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 1;
    }

    .upload-area {
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .upload-button,
    button {
      display: inline-block;
      cursor: pointer;
      margin: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-weight: 900;
      font-size: 15px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .upload-button:hover,
    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 0 #d95aa9,
        0 0 25px rgba(255, 141, 221, 1);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .book-wrap {
      margin-top: 28px;
      display: none;
    }

    .book {
      width: min(900px, 95vw);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      perspective: 1500px;
      filter: drop-shadow(0 24px 30px rgba(122,20,86,0.35));
    }

    .page {
      min-height: 560px;
      background: #fff6fd;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .page.left {
      border-radius: 28px 0 0 28px;
      border-right: 1px solid #efb3dc;
      box-shadow: inset -16px 0 22px rgba(122, 20, 86, 0.12);
    }

    .page.right {
      border-radius: 0 28px 28px 0;
      border-left: 1px solid #efb3dc;
      box-shadow: inset 16px 0 22px rgba(122, 20, 86, 0.12);
    }

    .page img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(122, 20, 86, 0.22);
      background: #fff;
    }

    .page-number {
      position: absolute;
      bottom: 12px;
      font-size: 13px;
      color: #b13a86;
      font-weight: bold;
    }

    .empty-page {
      color: #d678b7;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
    }

    .controls {
      text-align: center;
      margin-top: 24px;
    }

    .hint {
      text-align: center;
      font-size: 14px;
      color: #9d2a72;
      margin-top: 12px;
      font-weight: bold;
    }

    .turning-right {
      animation: turnRight 0.45s ease;
    }

    .turning-left {
      animation: turnLeft 0.45s ease;
    }

    @keyframes turnRight {
      from {
        transform: rotateY(0deg);
        opacity: 0.7;
      }
      to {
        transform: rotateY(-10deg);
        opacity: 1;
      }
    }

    @keyframes turnLeft {
      from {
        transform: rotateY(0deg);
        opacity: 0.7;
      }
      to {
        transform: rotateY(10deg);
        opacity: 1;
      }
    }

    @media (max-width: 700px) {
      .book {
        grid-template-columns: 1fr;
      }

      .page.left {
        display: none;
      }

      .page.right {
        border-radius: 28px;
      }

      .page {
        min-height: 480px;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <header>
    <h1>Pink Flipbook ♡</h1>
    <p class="subtitle">画像を選ぶと、取り込んだ順番で本みたいになります</p>
  </header>

  <section class="panel">
    <div class="upload-area">
      <label class="upload-button" for="imageInput">
        画像を選ぶ
      </label>
      <input id="imageInput" type="file" accept="image/*" multiple />

      <button id="resetButton" type="button">リセット</button>

      <p class="hint">
        複数画像を選ぶと、選んだ順番でページになります。今はまだ保存なしの試作品です。
      </p>
    </div>

    <div id="bookWrap" class="book-wrap">
      <div id="book" class="book">
        <div class="page left" id="leftPage">
          <div class="empty-page">左ページ</div>
        </div>
        <div class="page right" id="rightPage">
          <div class="empty-page">右ページ</div>
        </div>
      </div>

      <div class="controls">
        <button id="prevButton" type="button">← 前のページ</button>
        <button id="nextButton" type="button">次のページ →</button>
      </div>

      <p class="hint" id="pageInfo"></p>
    </div>
  </section>

  <script>
    const imageInput = document.getElementById("imageInput");
    const resetButton = document.getElementById("resetButton");
    const bookWrap = document.getElementById("bookWrap");
    const book = document.getElementById("book");
    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");

    let images = [];
    let currentSpread = 0;

    imageInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files);

      images = await Promise.all(
        files.map((file) => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
          });
        })
      );

      currentSpread = 0;
      renderBook();
    });

    resetButton.addEventListener("click", () => {
      images = [];
      currentSpread = 0;
      imageInput.value = "";
      bookWrap.style.display = "none";
    });

    prevButton.addEventListener("click", () => {
      if (currentSpread > 0) {
        currentSpread--;
        animateBook("turning-left");
        renderBook();
      }
    });

    nextButton.addEventListener("click", () => {
      const maxSpread = Math.ceil(images.length / 2) - 1;
      if (currentSpread < maxSpread) {
        currentSpread++;
        animateBook("turning-right");
        renderBook();
      }
    });

    function renderBook() {
      if (images.length === 0) {
        bookWrap.style.display = "none";
        return;
      }

      bookWrap.style.display = "block";

      const leftIndex = currentSpread * 2;
      const rightIndex = leftIndex + 1;

      leftPage.innerHTML = createPageContent(images[leftIndex], leftIndex);
      rightPage.innerHTML = createPageContent(images[rightIndex], rightIndex);

      const maxSpread = Math.ceil(images.length / 2) - 1;
      prevButton.disabled = currentSpread === 0;
      nextButton.disabled = currentSpread === maxSpread;

      pageInfo.textContent = `${currentSpread + 1} / ${maxSpread + 1} 見開き`;
    }

    function createPageContent(src, index) {
      if (!src) {
        return `<div class="empty-page">Blank page ♡</div>`;
      }

      return `
        <img src="${src}" alt="page ${index + 1}" />
        <div class="page-number">${index + 1}</div>
      `;
    }

    function animateBook(className) {
      book.classList.remove("turning-right", "turning-left");
      void book.offsetWidth;
      book.classList.add(className);
    }
  </script>
</body>
</html>
