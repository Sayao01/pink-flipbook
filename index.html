<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Flipbook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(760px, 94vw);
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }

    .card {
      width: 100%;
      padding: 34px 24px;
      border-radius: 34px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.52);
      box-shadow:
        0 14px 0 #d95aa9,
        0 0 34px rgba(255, 105, 210, 0.75),
        inset 0 0 18px rgba(255,255,255,0.65);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: clamp(38px, 10vw, 82px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.8;
      margin: 16px 0 22px;
    }

    input {
      width: min(440px, 90vw);
      padding: 15px 18px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.85);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255, 141, 221, 0.5);
      text-align: center;
    }

    button, a.button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 12px 6px 0;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow: 0 6px 0 #d95aa9, 0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    @media (max-width: 700px) {
      .card { padding: 28px 18px; }
      button, a.button { width: 100%; }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <section class="card">
      <h1>Pink Flipbook</h1>
      <p class="subtitle">
        画像本・文字本をストックできる<br />
        自分だけのY2K本棚を作ります♡
      </p>

      <input id="shelfNameInput" type="text" placeholder="本棚の名前 例：夢であえる本棚" />

      <div>
        <button id="startButton" type="button">本棚をはじめる</button>
        <a class="button" href="bookshelf.html">本棚に入る</a>
      </div>
    </section>
  </main>

  <script>
    const input = document.getElementById("shelfNameInput");
    const button = document.getElementById("startButton");

    const savedName = localStorage.getItem("pinkFlipbookShelfName");
    if (savedName) input.value = savedName;

    button.addEventListener("click", () => {
      const name = input.value.trim();

      if (!name) {
        alert("本棚の名前を入れてください。");
        return;
      }

      localStorage.setItem("pinkFlipbookShelfName", name);
      window.location.href = "bookshelf.html";
    });
  </script>
</body>
</html>
