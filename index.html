<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(600px, 90vw);
      padding: 34px 24px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.52);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: clamp(38px, 9vw, 78px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    p {
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.8;
      margin-top: 18px;
    }

    a.button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin-top: 16px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <div class="card">
    <h1>Pink Flipbook</h1>
    <p>ログイン状態を確認しています...</p>
    <a class="button" href="login.html">ログイン画面へ</a>
  </div>

  <script>
    const currentUser = localStorage.getItem("pinkFlipbookCurrentUser");

    if (currentUser) {
      window.location.href = "bookshelf.html";
    } else {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
