<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pink Flipbook</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .card {
      text-align: center;
      padding: 48px;
      border-radius: 32px;
      border: 3px solid white;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 30px rgba(255, 105, 210, 0.45);
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff, #ff9bdf);
      border: 2px solid white;
      box-shadow: 0 6px 0 #d95aa9, 0 0 18px #ff8ddd;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      color: #7a1456;
      transition: all 0.2s ease;
    }

    .button:hover {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #d95aa9, 0 0 18px #ff8ddd;
    }

    .button:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #d95aa9, 0 0 18px #ff8ddd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pink Flipbook ♡</h1>
    <p>画像を本みたいにめくれるアプリを作る予定です。</p>
    <button class="button">Coming Soon</button>
  </div>
</body>
</html>
