<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    header {
      text-align: center;
      padding: 20px 10px;
    }

    h1 {
      font-size: clamp(36px, 8vw, 82px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 20px auto;
      padding: 24px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
    }

    .top-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    a.button,
    button {
      text-decoration: none;
      cursor: pointer;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
      display: inline-block;
    }

    .bookshelf-title {
      font-size: 28px;
      color: #fff;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 18px #ff4fc3;
      margin: 8px 0 8px;
      text-align: center;
      letter-spacing: 3px;
      word-break: break-word;
    }

    .bookshelf-sub {
      text-align: center;
      color: #9d2a72;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .login-user {
      text-align: center;
      color: #8c1d63;
      font-weight: bold;
      margin-bottom: 12px;
      line-height: 1.7;
    }

    .bookshelf {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      min-height: 235px;
      padding: 18px;
      border-radius: 24px;
      border: 3px solid #fff;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,182,230,0.75));
      box-shadow:
        0 12px 0 #d95aa9,
        0 0 22px rgba(255,105,210,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .book-cover {
      height: 116px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
      color: #d95aa9;
      font-size: 34px;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-title {
      font-size: 17px;
      color: #7a1456;
      font-weight: bold;
      word-break: break-word;
      line-height: 1.5;
    }

    .book-meta {
      font-size: 13px;
      color: #b13a86;
      margin-top: 6px;
      line-height: 1.5;
    }

    .book-actions {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-button {
      padding: 9px 14px;
      font-size: 13px;
      box-shadow:
        0 4px 0 #d95aa9,
        0 0 12px rgba(255,141,221,0.9);
    }

    .empty-shelf {
      text-align: center;
      padding: 38px 12px;
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      .app {
        width: 94vw;
        padding: 22px 0 36px;
      }

      header {
        padding: 16px 8px;
      }

      h1 {
        font-size: clamp(34px, 12vw, 56px);
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 13px;
      }

      .panel {
        padding: 16px;
        border-radius: 26px;
        margin: 16px auto;
      }

      a.button,
      button {
        width: 100%;
        text-align: center;
        padding: 12px 16px;
        font-size: 13px;
      }

      .bookshelf {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .book-card {
        min-height: 220px;
        padding: 12px;
        border-radius: 20px;
      }

      .book-cover {
        height: 105px;
        border-radius: 14px;
      }

      .book-title {
        font-size: 14px;
      }

      .book-meta {
        font-size: 11px;
      }

      .small-button {
        width: auto;
        padding: 8px 10px;
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {
      .bookshelf {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1 id="mainTitle">MY BOOKSHELF</h1>
      <p class="subtitle">画像本・文字本をストックできるY2K本棚</p>
    </header>

    <section class="panel">
      <p id="loginUser" class="login-user"></p>

      <div class="top-actions">
        <a class="button" href="create.html">＋ 新しい本を作る</a>
        <a class="button" href="export.html">共有用HTMLを作る</a>
        <button id="renameShelfButton" type="button">本棚名を変える</button>
        <button id="logoutButton" type="button">ログアウト</button>
      </div>

      <h2 id="bookshelfTitle" class="bookshelf-title">MY BOOKSHELF</h2>
      <p class="bookshelf-sub">あなたの本をここにストックできます♡</p>

      <div id="bookshelf" class="bookshelf"></div>

      <div id="emptyShelf" class="empty-shelf">
        読み込み中...
      </div>
    </section>
  </main>

  <script src="db.js"></script>

  <script>
    const currentUser = requireLogin();

    const mainTitle = document.getElementById("mainTitle");
    const bookshelfTitle = document.getElementById("bookshelfTitle");
    const bookshelf = document.getElementById("bookshelf");
    const emptyShelf = document.getElementById("emptyShelf");
    const renameShelfButton = document.getElementById("renameShelfButton");
    const logoutButton = document.getElementById("logoutButton");
    const loginUser = document.getElementById("loginUser");

    let books = [];

    if (currentUser) {
      initBookshelf();
    }

    async function initBookshelf() {
      loginUser.textContent = "ログイン中：" + currentUser;

      let shelfName = getShelfName(currentUser);

      if (!shelfName) {
        shelfName = currentUser + "の本棚";
        saveShelfName(currentUser, shelfName);
      }

      setShelfTitle(shelfName);
      await loadBooks();
    }

    renameShelfButton.addEventListener("click", () => {
      const oldName = getShelfName(currentUser) || currentUser + "の本棚";
      const newName = prompt("新しい本棚名を入れてください。", oldName);

      if (newName === null) return;

      const trimmed = newName.trim();

      if (!trimmed) {
        alert("本棚名は空にできません。");
        return;
      }

      saveShelfName(currentUser, trimmed);
      setShelfTitle(trimmed);
    });

    logoutButton.addEventListener("click", () => {
      const ok = confirm("ログアウトしますか？");
      if (!ok) return;

      logoutUser();
    });

    async function loadBooks() {
      try {
        books = await getBooksByUser(currentUser);
        renderBookshelf();
      } catch (error) {
        console.error(error);
        emptyShelf.style.display = "block";
        emptyShelf.textContent = "本棚の読み込みに失敗しました。";
      }
    }

    function setShelfTitle(name) {
      mainTitle.textContent = name;
      bookshelfTitle.textContent = name;
      document.title = name;
    }

    function renderBookshelf() {
      bookshelf.innerHTML = "";

      if (books.length === 0) {
        emptyShelf.style.display = "block";
        emptyShelf.innerHTML = `
          まだ本がありません。<br />
          「＋ 新しい本を作る」から追加できます♡
        `;
        return;
      }

      emptyShelf.style.display = "none";

      books.forEach((book) => {
        const card = document.createElement("div");
        card.className = "book-card";

        const isTextBook = book.type === "text";

        const coverImage = !isTextBook && book.images && book.images[0]
          ? '<img src="' + book.images[0] + '" alt="cover" />'
          : isTextBook
            ? '<div>✍️</div>'
            : '<div>♡</div>';

        const pageCount = isTextBook
          ? (book.textPages ? book.textPages.length : 0)
          : (book.images ? book.images.length : 0);

        const typeLabel = isTextBook ? "文字本" : "画像本";
        const directionLabel = book.direction === "rtl" ? "右開き" : "左開き";
        const dateLabel = book.bookDate || book.createdAt || "";

        let novelInfo = "";

        if (isTextBook) {
          const fontLabel = getFontLabel(book.novelFont);
          const sizeLabel = getSizeLabel(book.novelSize);
          novelInfo = `<div class="book-meta">${fontLabel} / ${sizeLabel}</div>`;
        }

        card.innerHTML = `
          <div>
            <div class="book-cover">${coverImage}</div>
            <div class="book-title">${escapeHtml(book.title)}</div>
            <div class="book-meta">${escapeHtml(dateLabel)}</div>
            <div class="book-meta">${typeLabel} / ${directionLabel}</div>
            ${novelInfo}
            <div class="book-meta">${pageCount} pages</div>
          </div>

          <div class="book-actions">
            <a class="button small-button" href="book.html?id=${book.id}">開く</a>
            <a class="button small-button" href="edit.html?id=${book.id}">編集</a>
            <button class="small-button" data-delete="${book.id}">消す</button>
          </div>
        `;

        bookshelf.appendChild(card);
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", async () => {
          const id = button.getAttribute("data-delete");
          const ok = confirm("この本を消しますか？");
          if (!ok) return;

          try {
            await deleteBookFromDB(id);
            await loadBooks();
          } catch (error) {
            console.error(error);
            alert("削除に失敗しました。");
          }
        });
      });
    }

    function getFontLabel(font) {
      if (font === "serif") return "明朝";
      if (font === "maru") return "丸ゴ";
      return "ドット";
    }

    function getSizeLabel(size) {
      if (size === "small") return "小";
      if (size === "large") return "大";
      return "中";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
