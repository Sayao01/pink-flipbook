<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Book</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(900px, 94vw);
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 78px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 14px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.8;
    }

    .panel {
      margin: 24px auto;
      padding: 30px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.50);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      margin: 26px 0;
    }

    .choice {
      text-decoration: none;
      min-height: 210px;
      padding: 26px 18px;
      border-radius: 28px;
      border: 3px solid #fff;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.88), rgba(255,177,230,0.78));
      box-shadow:
        0 10px 0 #d95aa9,
        0 0 22px rgba(255,105,210,0.55);
      color: #7a1456;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
    }

    .choice:hover {
      transform: translateY(-4px);
    }

    .choice-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .choice-title {
      font-size: 24px;
      color: #fff;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 16px #ff4fc3;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .choice-text {
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
      font-size: 14px;
    }

    a.button,
    button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .app {
        width: 94vw;
        padding: 28px 0 40px;
      }

      .panel {
        padding: 18px;
      }

      .choice-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .choice {
        min-height: 170px;
      }

      a.button,
      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Create Book</h1>
      <p class="subtitle">作りたい本の種類を選んでください♡</p>
    </header>

    <section class="panel">
      <p id="loginUser" class="hint"></p>

      <div class="choice-grid">
        <a class="choice" href="create-image.html">
          <div class="choice-icon">🖼️</div>
          <div class="choice-title">画像本</div>
          <div class="choice-text">
            画像を取り込んで<br />
            本みたいにめくれます
          </div>
        </a>

        <a class="choice" href="create-text.html">
          <div class="choice-icon">✍️</div>
          <div class="choice-title">文字本</div>
          <div class="choice-text">
            小説ログ用に<br />
            縦書き・二段組で作れます
          </div>
        </a>
      </div>

      <a class="button" href="bookshelf.html">← 本棚に戻る</a>
      <button id="logoutButton" type="button">ログアウト</button>
    </section>
  </main>

  <script src="db.js"></script>

  <script>
    const currentUser = requireLogin();

    const loginUser = document.getElementById("loginUser");
    const logoutButton = document.getElementById("logoutButton");

    if (currentUser) {
      loginUser.textContent = "ログイン中：" + currentUser;
    }

    logoutButton.addEventListener("click", () => {
      const ok = confirm("ログアウトしますか？");
      if (!ok) return;

      logoutUser();
    });
  </script>
</body>
</html>
