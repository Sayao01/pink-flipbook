<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Book</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Kosugi+Maru&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1120px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 28px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button,
    button,
    .upload-label {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    input[type="file"] {
      display: none;
    }

    input[type="text"] {
      width: min(560px, 90vw);
      padding: 15px 18px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.78);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255,141,221,0.5);
      margin: 12px 0;
    }

    .choice-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0;
    }

    .choice-card {
      cursor: pointer;
      width: 170px;
      padding: 14px;
      border-radius: 22px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 7px 0 #d95aa9, 0 0 16px rgba(255,141,221,0.7);
      font-weight: bold;
      text-align: center;
    }

    .choice-card.active {
      background: linear-gradient(135deg, #fff, #ff9bdf);
      transform: translateY(-3px);
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .section-title {
      color: #fff;
      font-size: 24px;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 18px #ff4fc3;
      letter-spacing: 3px;
      margin-top: 26px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .preview {
      min-height: 175px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.55);
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 18px rgba(122, 20, 86, 0.18);
      padding-bottom: 12px;
      text-align: center;
    }

    .preview img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    .preview-number {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,0.8);
      color: #b13a86;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .page-list {
      display: grid;
      gap: 24px;
      margin-top: 24px;
    }

    .page-editor {
      padding: 20px;
      border-radius: 24px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.58);
      box-shadow:
        0 8px 0 #d95aa9,
        0 0 20px rgba(255,141,221,0.55);
      text-align: left;
    }

    .page-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .page-label {
      color: #fff;
      font-size: 20px;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 14px #ff4fc3;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .columns-editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .column-box {
      background: rgba(255,255,255,0.45);
      border: 2px solid #fff;
      border-radius: 20px;
      padding: 14px;
    }

    .column-label {
      color: #9d2a72;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 360px;
      padding: 18px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.9);
      color: #3f2435;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "MS Mincho", serif;
      font-size: 15px;
      line-height: 1.9;
      outline: none;
      resize: vertical;
      box-shadow: inset 0 0 12px rgba(255, 141, 221, 0.45);
    }

    textarea.vertical-input {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 2;
      letter-spacing: 0.04em;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: start;
    }

    textarea.horizontal-input {
      writing-mode: horizontal-tb;
      overflow-y: auto;
      text-align: left;
    }

    .counter {
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: #9d2a72;
      font-weight: bold;
    }

    .small-button {
      padding: 9px 14px;
      font-size: 13px;
      box-shadow:
        0 4px 0 #d95aa9,
        0 0 12px rgba(255,141,221,0.9);
    }

    .danger {
      color: #b71970;
    }

    .hidden {
      display: none;
    }

    .bottom-actions {
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .app {
        width: 96vw;
        padding: 24px 0 40px;
      }

      .panel {
        padding: 18px;
      }

      a.button,
      button,
      .upload-label {
        width: 100%;
      }

      .choice-card {
        width: 100%;
      }

      .columns-editor {
        grid-template-columns: 1fr;
      }

      textarea {
        height: 320px;
        font-size: 14px;
      }

      .preview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Edit Book</h1>
      <p class="subtitle">作った本をあとから編集できます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="bookshelf.html">← 本棚に戻る</a>

      <div id="missingMessage" class="hint danger hidden">
        本が見つかりませんでした。<br />
        本棚からもう一度開いてください。
      </div>

      <div id="editorArea">
        <div>
          <input id="bookTitleInput" type="text" placeholder="本のタイトル" />
        </div>

        <p class="hint">開き方を選んでください。</p>

        <div class="choice-box">
          <div id="rtlButton" class="choice-card">右開き<br />縦書き</div>
          <div id="ltrButton" class="choice-card">左開き<br />横書き</div>
        </div>

        <div id="textOptions" class="hidden">
          <p class="hint">フォントを選んでください。</p>

          <div class="choice-box">
            <div id="fontSerifButton" class="choice-card">明朝</div>
            <div id="fontMaruButton" class="choice-card">丸ゴ</div>
            <div id="fontDotButton" class="choice-card">ドット</div>
          </div>

          <p class="hint">文字サイズを選んでください。</p>

          <div class="choice-box">
            <div id="sizeSmallButton" class="choice-card">小</div>
            <div id="sizeMediumButton" class="choice-card">中</div>
            <div id="sizeLargeButton" class="choice-card">大</div>
          </div>
        </div>

        <div id="imageEditor" class="hidden">
          <h2 class="section-title">IMAGE PAGES</h2>

          <label class="upload-label" for="imageInput">画像を追加する</label>
          <input id="imageInput" type="file" accept="image/*" multiple />

          <p class="hint">
            追加した画像は最後のページに入ります。<br />
            不要なページは「消す」で削除できます。
          </p>

          <div id="previewGrid" class="preview-grid"></div>
        </div>

        <div id="textEditor" class="hidden">
          <h2 class="section-title">TEXT PAGES</h2>

          <p class="hint">
            小説は1ページ2段組です。<br />
            各段は500文字まで編集できます。
          </p>

          <div id="pageList" class="page-list"></div>

          <button id="addPageButton" type="button">＋ ページを追加</button>
        </div>

        <div class="bottom-actions">
          <button id="saveButton" type="button">変更を保存する</button>
          <a id="openBookLink" class="button" href="#">この本を開く</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    const missingMessage = document.getElementById("missingMessage");
    const editorArea = document.getElementById("editorArea");

    const bookTitleInput = document.getElementById("bookTitleInput");

    const rtlButton = document.getElementById("rtlButton");
    const ltrButton = document.getElementById("ltrButton");

    const textOptions = document.getElementById("textOptions");
    const imageEditor = document.getElementById("imageEditor");
    const textEditor = document.getElementById("textEditor");

    const imageInput = document.getElementById("imageInput");
    const previewGrid = document.getElementById("previewGrid");

    const pageList = document.getElementById("pageList");
    const addPageButton = document.getElementById("addPageButton");

    const fontSerifButton = document.getElementById("fontSerifButton");
    const fontMaruButton = document.getElementById("fontMaruButton");
    const fontDotButton = document.getElementById("fontDotButton");

    const sizeSmallButton = document.getElementById("sizeSmallButton");
    const sizeMediumButton = document.getElementById("sizeMediumButton");
    const sizeLargeButton = document.getElementById("sizeLargeButton");

    const saveButton = document.getElementById("saveButton");
    const openBookLink = document.getElementById("openBookLink");

    let books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];
    let bookIndex = books.findIndex((book) => book.id === bookId);
    let currentBook = books[bookIndex];

    let direction = "ltr";
    let novelFont = "serif";
    let novelSize = "medium";
    let images = [];
    let textPages = [];

    if (!currentBook) {
      missingMessage.classList.remove("hidden");
      editorArea.classList.add("hidden");
    } else {
      initEditor();
    }

    function initEditor() {
      document.title = "Edit - " + currentBook.title;

      bookTitleInput.value = currentBook.title || "";
      direction = currentBook.direction || "ltr";

      images = currentBook.images ? [...currentBook.images] : [];
      textPages = normalizeTextPages(currentBook.textPages || []);

      novelFont = currentBook.novelFont || "serif";
      novelSize = currentBook.novelSize || "medium";

      openBookLink.href = "book.html?id=" + currentBook.id;

      updateDirectionButtons();

      if (currentBook.type === "text") {
        textOptions.classList.remove("hidden");
        textEditor.classList.remove("hidden");
        updateFontButtons();
        updateSizeButtons();
        renderTextPages();
      } else {
        imageEditor.classList.remove("hidden");
        renderImages();
      }
    }

    rtlButton.addEventListener("click", () => {
      direction = "rtl";
      updateDirectionButtons();
      if (currentBook && currentBook.type === "text") renderTextPages();
    });

    ltrButton.addEventListener("click", () => {
      direction = "ltr";
      updateDirectionButtons();
      if (currentBook && currentBook.type === "text") renderTextPages();
    });

    fontSerifButton.addEventListener("click", () => {
      novelFont = "serif";
      updateFontButtons();
      applyTextAreaStyle();
    });

    fontMaruButton.addEventListener("click", () => {
      novelFont = "maru";
      updateFontButtons();
      applyTextAreaStyle();
    });

    fontDotButton.addEventListener("click", () => {
      novelFont = "dot";
      updateFontButtons();
      applyTextAreaStyle();
    });

    sizeSmallButton.addEventListener("click", () => {
      novelSize = "small";
      updateSizeButtons();
      applyTextAreaStyle();
    });

    sizeMediumButton.addEventListener("click", () => {
      novelSize = "medium";
      updateSizeButtons();
      applyTextAreaStyle();
    });

    sizeLargeButton.addEventListener("click", () => {
      novelSize = "large";
      updateSizeButtons();
      applyTextAreaStyle();
    });

    imageInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files);

      const addedImages = await Promise.all(
        files.map((file) => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
          });
        })
      );

      images = images.concat(addedImages);
      imageInput.value = "";
      renderImages();
    });

    addPageButton.addEventListener("click", () => {
      saveCurrentText();
      textPages.push({ column1: "", column2: "" });
      renderTextPages();
    });

    saveButton.addEventListener("click", () => {
      const title = bookTitleInput.value.trim();

      if (!title) {
        alert("本のタイトルを入れてください。");
        return;
      }

      currentBook.title = title;
      currentBook.direction = direction;
      currentBook.updatedAt = new Date().toLocaleString("ja-JP");

      if (currentBook.type === "image") {
        if (images.length === 0) {
          alert("画像ページが1枚もありません。");
          return;
        }

        currentBook.images = images;
        currentBook.textPages = [];
      }

      if (currentBook.type === "text") {
        saveCurrentText();

        const cleanedPages = textPages
          .map((page) => ({
            column1: page.column1.trim(),
            column2: page.column2.trim()
          }))
          .filter((page) => page.column1.length > 0 || page.column2.length > 0);

        if (cleanedPages.length === 0) {
          alert("本文を書いてください。");
          return;
        }

        currentBook.textPages = cleanedPages;
        currentBook.images = [];
        currentBook.novelFont = novelFont;
        currentBook.novelSize = novelSize;
      }

      books[bookIndex] = currentBook;
      localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));

      alert("変更を保存しました♡");
      window.location.href = "bookshelf.html";
    });

    function renderImages() {
      previewGrid.innerHTML = "";

      images.forEach((src, index) => {
        const item = document.createElement("div");
        item.className = "preview";

        item.innerHTML = `
          <img src="${src}" alt="page ${index + 1}" />
          <div class="preview-number">PAGE ${index + 1}</div>
          <button class="small-button" data-delete-image="${index}" type="button">消す</button>
        `;

        previewGrid.appendChild(item);
      });

      document.querySelectorAll("[data-delete-image]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-delete-image"));

          const ok = confirm("この画像ページを消しますか？");
          if (!ok) return;

          images.splice(index, 1);
          renderImages();
        });
      });
    }

    function renderTextPages() {
      if (currentBook && currentBook.type !== "text") return;

      saveCurrentText();

      pageList.innerHTML = "";

      textPages.forEach((pageData, index) => {
        const page = document.createElement("div");
        page.className = "page-editor";

        const inputClass = direction === "rtl" ? "vertical-input" : "horizontal-input";

        page.innerHTML = `
          <div class="page-editor-header">
            <div class="page-label">PAGE ${index + 1}</div>
            <button class="small-button" data-delete-text="${index}" type="button">このページを消す</button>
          </div>

          <div class="columns-editor">
            <div class="column-box">
              <div class="column-label">1段目 / 500文字</div>
              <textarea maxlength="500" class="${inputClass}" data-page="${index}" data-column="column1">${escapeHtml(pageData.column1)}</textarea>
              <div class="counter" data-counter="${index}-column1">${pageData.column1.length} / 500</div>
            </div>

            <div class="column-box">
              <div class="column-label">2段目 / 500文字</div>
              <textarea maxlength="500" class="${inputClass}" data-page="${index}" data-column="column2">${escapeHtml(pageData.column2)}</textarea>
              <div class="counter" data-counter="${index}-column2">${pageData.column2.length} / 500</div>
            </div>
          </div>
        `;

        pageList.appendChild(page);
      });

      document.querySelectorAll("[data-delete-text]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-delete-text"));

          if (textPages.length === 1) {
            alert("ページは最低1つ必要です。");
            return;
          }

          saveCurrentText();
          textPages.splice(index, 1);
          renderTextPages();
        });
      });

      document.querySelectorAll("textarea").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          const pageIndex = textarea.getAttribute("data-page");
          const column = textarea.getAttribute("data-column");
          const counter = document.querySelector(`[data-counter="${pageIndex}-${column}"]`);
          counter.textContent = textarea.value.length + " / 500";
        });
      });

      applyTextAreaStyle();
    }

    function saveCurrentText() {
      document.querySelectorAll("textarea[data-page]").forEach((textarea) => {
        const index = Number(textarea.getAttribute("data-page"));
        const column = textarea.getAttribute("data-column");

        if (!textPages[index]) {
          textPages[index] = { column1: "", column2: "" };
        }

        textPages[index][column] = textarea.value;
      });
    }

    function normalizeTextPages(rawPages) {
      if (rawPages.length === 0) {
        return [{ column1: "", column2: "" }];
      }

      if (typeof rawPages[0] === "object") {
        return rawPages.map((page) => ({
          column1: page.column1 || "",
          column2: page.column2 || ""
        }));
      }

      const joinedText = rawPages.join("\n\n");
      const chunks = [];

      for (let i = 0; i < joinedText.length; i += 500) {
        chunks.push(joinedText.slice(i, i + 500));
      }

      const pages = [];

      for (let i = 0; i < chunks.length; i += 2) {
        pages.push({
          column1: chunks[i] || "",
          column2: chunks[i + 1] || ""
        });
      }

      return pages.length ? pages : [{ column1: "", column2: "" }];
    }

    function updateDirectionButtons() {
      rtlButton.classList.toggle("active", direction === "rtl");
      ltrButton.classList.toggle("active", direction === "ltr");
    }

    function updateFontButtons() {
      fontSerifButton.classList.toggle("active", novelFont === "serif");
      fontMaruButton.classList.toggle("active", novelFont === "maru");
      fontDotButton.classList.toggle("active", novelFont === "dot");
    }

    function updateSizeButtons() {
      sizeSmallButton.classList.toggle("active", novelSize === "small");
      sizeMediumButton.classList.toggle("active", novelSize === "medium");
      sizeLargeButton.classList.toggle("active", novelSize === "large");
    }

    function applyTextAreaStyle() {
      document.querySelectorAll("textarea").forEach((textarea) => {
        textarea.style.fontFamily = getFontFamily(novelFont);
        textarea.style.fontSize = getFontSize(novelSize);
      });
    }

    function getFontFamily(font) {
      if (font === "dot") return '"DotGothic16", sans-serif';
      if (font === "maru") return '"Kosugi Maru", "Hiragino Maru Gothic ProN", sans-serif';
      return '"Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "MS Mincho", serif';
    }

    function getFontSize(size) {
      if (size === "small") return "13px";
      if (size === "large") return "16px";
      return "14.5px";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
