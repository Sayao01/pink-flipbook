<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Text Book</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Kosugi+Maru&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1120px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow: 0 4px 0 #d95aa9, 0 0 18px #ff4fc3, 0 0 36px #fff;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 28px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button, button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow: 0 6px 0 #d95aa9, 0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    input[type="text"] {
      width: min(560px, 90vw);
      padding: 15px 18px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.78);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255,141,221,0.5);
      margin: 12px 0;
    }

    .choice-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0;
    }

    .choice-card {
      cursor: pointer;
      width: 170px;
      padding: 14px;
      border-radius: 22px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 7px 0 #d95aa9, 0 0 16px rgba(255,141,221,0.7);
      font-weight: bold;
      text-align: center;
    }

    .choice-card.active {
      background: linear-gradient(135deg, #fff, #ff9bdf);
      transform: translateY(-3px);
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .page-list {
      display: grid;
      gap: 24px;
      margin-top: 24px;
    }

    .page-editor {
      padding: 20px;
      border-radius: 24px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.58);
      box-shadow: 0 8px 0 #d95aa9, 0 0 20px rgba(255,141,221,0.55);
      text-align: left;
    }

    .page-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .page-label {
      color: #fff;
      font-size: 20px;
      text-shadow: 0 3px 0 #d95aa9, 0 0 14px #ff4fc3;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .columns-editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .column-box {
      background: rgba(255,255,255,0.45);
      border: 2px solid #fff;
      border-radius: 20px;
      padding: 14px;
    }

    .column-label {
      color: #9d2a72;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 360px;
      padding: 18px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.9);
      color: #3f2435;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "MS Mincho", serif;
      font-size: 15px;
      line-height: 1.9;
      outline: none;
      resize: vertical;
      box-shadow: inset 0 0 12px rgba(255, 141, 221, 0.45);
    }

    textarea.vertical-input {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 2;
      letter-spacing: 0.04em;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: start;
    }

    textarea.horizontal-input {
      writing-mode: horizontal-tb;
      overflow-y: auto;
      text-align: left;
    }

    .counter {
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: #9d2a72;
      font-weight: bold;
    }

    .counter.over {
      color: #d0006f;
    }

    .small-button {
      padding: 9px 14px;
      font-size: 13px;
      box-shadow: 0 4px 0 #d95aa9, 0 0 12px rgba(255,141,221,0.9);
    }

    .bottom-actions { margin-top: 24px; }

    @media (max-width: 700px) {
      .app { width: 96vw; padding: 24px 0 40px; }
      .panel { padding: 18px; }
      a.button, button { width: 100%; }
      .choice-card { width: 100%; }
      .columns-editor { grid-template-columns: 1fr; }
      textarea { height: 320px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Text Book</h1>
      <p class="subtitle">小説は1ページ2段組・1段500文字までです♡</p>
    </header>

    <section class="panel">
      <a class="button" href="create.html">← 種類選択に戻る</a>
      <a class="button" href="bookshelf.html">本棚に戻る</a>

      <div>
        <input id="bookTitleInput" type="text" placeholder="本のタイトルを入れてください" />
      </div>

      <p class="hint">開き方を選んでください。</p>

      <div class="choice-box">
        <div id="rtlButton" class="choice-card active">右開き<br />縦書き</div>
        <div id="ltrButton" class="choice-card">左開き<br />横書き</div>
      </div>

      <p class="hint">フォントを選んでください。</p>

      <div class="choice-box">
        <div id="fontSerifButton" class="choice-card active">明朝</div>
        <div id="fontMaruButton" class="choice-card">丸ゴ</div>
        <div id="fontDotButton" class="choice-card">ドット</div>
      </div>

      <p class="hint">文字サイズを選んでください。</p>

      <div class="choice-box">
        <div id="sizeSmallButton" class="choice-card">小</div>
        <div id="sizeMediumButton" class="choice-card active">中</div>
        <div id="sizeLargeButton" class="choice-card">大</div>
      </div>

      <p class="hint">
        各段は500文字まで入力できます。<br />
        1ページは「1段目500文字＋2段目500文字」の固定です。
      </p>

      <div id="pageList" class="page-list"></div>

      <div class="bottom-actions">
        <button id="addPageButton" type="button">＋ ページを追加</button>
        <button id="saveBookButton" type="button">文字本を本棚に追加する</button>
      </div>
    </section>
  </main>

  <script>
    const bookTitleInput = document.getElementById("bookTitleInput");
    const pageList = document.getElementById("pageList");
    const addPageButton = document.getElementById("addPageButton");
    const saveBookButton = document.getElementById("saveBookButton");

    const rtlButton = document.getElementById("rtlButton");
    const ltrButton = document.getElementById("ltrButton");

    const fontDotButton = document.getElementById("fontDotButton");
    const fontSerifButton = document.getElementById("fontSerifButton");
    const fontMaruButton = document.getElementById("fontMaruButton");

    const sizeSmallButton = document.getElementById("sizeSmallButton");
    const sizeMediumButton = document.getElementById("sizeMediumButton");
    const sizeLargeButton = document.getElementById("sizeLargeButton");

    let pages = [{ column1: "", column2: "" }];
    let direction = "rtl";
    let novelFont = "serif";
    let novelSize = "medium";

    renderPages();

    rtlButton.addEventListener("click", () => {
      direction = "rtl";
      rtlButton.classList.add("active");
      ltrButton.classList.remove("active");
      renderPages();
    });

    ltrButton.addEventListener("click", () => {
      direction = "ltr";
      ltrButton.classList.add("active");
      rtlButton.classList.remove("active");
      renderPages();
    });

    fontDotButton.addEventListener("click", () => setFont("dot"));
    fontSerifButton.addEventListener("click", () => setFont("serif"));
    fontMaruButton.addEventListener("click", () => setFont("maru"));

    sizeSmallButton.addEventListener("click", () => setSize("small"));
    sizeMediumButton.addEventListener("click", () => setSize("medium"));
    sizeLargeButton.addEventListener("click", () => setSize("large"));

    addPageButton.addEventListener("click", () => {
      saveCurrentText();
      pages.push({ column1: "", column2: "" });
      renderPages();
    });

    saveBookButton.addEventListener("click", () => {
      saveCurrentText();

      const title = bookTitleInput.value.trim();

      if (!title) {
        alert("本のタイトルを入れてください。");
        return;
      }

      const textPages = pages
        .map(page => ({
          column1: page.column1.trim(),
          column2: page.column2.trim()
        }))
        .filter(page => page.column1.length > 0 || page.column2.length > 0);

      if (textPages.length === 0) {
        alert("本文を書いてください。");
        return;
      }

      const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];

      const newBook = {
        id: Date.now().toString(),
        title: title,
        type: "text",
        direction: direction,
        novelFont: novelFont,
        novelSize: novelSize,
        images: [],
        textPages: textPages,
        createdAt: new Date().toLocaleString("ja-JP")
      };

      books.unshift(newBook);
      localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));

      alert("文字本を本棚に追加しました♡");
      window.location.href = "bookshelf.html";
    });

    function setFont(font) {
      novelFont = font;
      fontDotButton.classList.toggle("active", font === "dot");
      fontSerifButton.classList.toggle("active", font === "serif");
      fontMaruButton.classList.toggle("active", font === "maru");
      applyEditorStyle();
    }

    function setSize(size) {
      novelSize = size;
      sizeSmallButton.classList.toggle("active", size === "small");
      sizeMediumButton.classList.toggle("active", size === "medium");
      sizeLargeButton.classList.toggle("active", size === "large");
      applyEditorStyle();
    }

    function renderPages() {
      saveCurrentText();

      pageList.innerHTML = "";

      pages.forEach((pageData, index) => {
        const page = document.createElement("div");
        page.className = "page-editor";

        const inputClass = direction === "rtl" ? "vertical-input" : "horizontal-input";

        page.innerHTML = `
          <div class="page-editor-header">
            <div class="page-label">PAGE ${index + 1}</div>
            <button class="small-button" data-delete="${index}" type="button">このページを消す</button>
          </div>

          <div class="columns-editor">
            <div class="column-box">
              <div class="column-label">1段目 / 500文字</div>
              <textarea maxlength="500" class="${inputClass}" data-page="${index}" data-column="column1">${escapeHtml(pageData.column1)}</textarea>
              <div class="counter" data-counter="${index}-column1">${pageData.column1.length} / 500</div>
            </div>

            <div class="column-box">
              <div class="column-label">2段目 / 500文字</div>
              <textarea maxlength="500" class="${inputClass}" data-page="${index}" data-column="column2">${escapeHtml(pageData.column2)}</textarea>
              <div class="counter" data-counter="${index}-column2">${pageData.column2.length} / 500</div>
            </div>
          </div>
        `;

        pageList.appendChild(page);
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-delete"));

          if (pages.length === 1) {
            alert("ページは最低1つ必要です。");
            return;
          }

          saveCurrentText();
          pages.splice(index, 1);
          renderPages();
        });
      });

      document.querySelectorAll("textarea").forEach((textarea) => {
        textarea.addEventListener("input", () => {
          const pageIndex = textarea.getAttribute("data-page");
          const column = textarea.getAttribute("data-column");
          const counter = document.querySelector(`[data-counter="${pageIndex}-${column}"]`);
          counter.textContent = textarea.value.length + " / 500";
        });
      });

      applyEditorStyle();
    }

    function applyEditorStyle() {
      document.querySelectorAll("textarea").forEach((textarea) => {
        textarea.style.fontFamily = getFontFamily(novelFont);
        textarea.style.fontSize = getFontSize(novelSize);
      });
    }

    function saveCurrentText() {
      document.querySelectorAll("textarea[data-page]").forEach((textarea) => {
        const index = Number(textarea.getAttribute("data-page"));
        const column = textarea.getAttribute("data-column");

        if (!pages[index]) {
          pages[index] = { column1: "", column2: "" };
        }

        pages[index][column] = textarea.value;
      });
    }

    function getFontFamily(font) {
      if (font === "dot") return '"DotGothic16", sans-serif';
      if (font === "maru") return '"Kosugi Maru", "Hiragino Maru Gothic ProN", sans-serif';
      return '"Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "MS Mincho", serif';
    }

    function getFontSize(size) {
      if (size === "small") return "13px";
      if (size === "large") return "16px";
      return "14.5px";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
