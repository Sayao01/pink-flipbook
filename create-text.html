<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Text Book - Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(980px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header { text-align: center; padding: 24px 10px; }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow: 0 4px 0 #d95aa9, 0 0 18px #ff4fc3, 0 0 36px #fff;
    }

    .subtitle { margin-top: 12px; color: #8c1d63; font-weight: bold; line-height: 1.7; }

    .panel {
      margin: 24px auto;
      padding: 28px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow: 0 0 30px rgba(255,105,210,0.45), inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button, button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow: 0 6px 0 #d95aa9, 0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    input[type="text"] {
      width: min(560px, 90vw);
      padding: 15px 18px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.78);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255,141,221,0.5);
      margin: 12px 0;
    }

    .direction-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0;
    }

    .direction-card {
      cursor: pointer;
      width: 170px;
      padding: 14px;
      border-radius: 22px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 7px 0 #d95aa9, 0 0 16px rgba(255,141,221,0.7);
      font-weight: bold;
    }

    .direction-card.active {
      background: linear-gradient(135deg, #fff, #ff9bdf);
      transform: translateY(-3px);
    }

    .hint { color: #9d2a72; font-weight: bold; line-height: 1.8; font-size: 14px; }

    .page-list {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .page-editor {
      padding: 18px;
      border-radius: 24px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.58);
      box-shadow: 0 8px 0 #d95aa9, 0 0 20px rgba(255,141,221,0.55);
      text-align: left;
    }

    .page-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .page-label {
      color: #fff;
      font-size: 20px;
      text-shadow: 0 3px 0 #d95aa9, 0 0 14px #ff4fc3;
      letter-spacing: 2px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      padding: 18px;
      border-radius: 18px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.82);
      color: #5f1747;
      font-family: "DotGothic16", sans-serif;
      font-size: 16px;
      line-height: 1.9;
      outline: none;
      resize: vertical;
      box-shadow: inset 0 0 12px rgba(255,141,221,0.45);
    }

    .small-button {
      padding: 9px 14px;
      font-size: 13px;
      box-shadow: 0 4px 0 #d95aa9, 0 0 12px rgba(255,141,221,0.9);
    }

    .bottom-actions { margin-top: 24px; }

    @media (max-width: 700px) {
      .panel { padding: 18px; }
      a.button, button { width: 100%; }
      .direction-card { width: 100%; }
      textarea { min-height: 220px; font-size: 14px; }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Text Book</h1>
      <p class="subtitle">小説ログ用に、ページごとに文章を書けます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="create.html">← 種類選択に戻る</a>
      <a class="button" href="bookshelf.html">本棚に戻る</a>

      <div>
        <input id="bookTitleInput" type="text" placeholder="本のタイトルを入れてください" />
      </div>

      <p class="hint">開き方を選んでください。</p>

      <div class="direction-box">
        <div id="rtlButton" class="direction-card active">右開き<br />縦書き</div>
        <div id="ltrButton" class="direction-card">左開き<br />横書き</div>
      </div>

      <p class="hint">
        ページごとに本文を書いてください。<br />
        「＋ページを追加」でページを増やせます。
      </p>

      <div id="pageList" class="page-list"></div>

      <div class="bottom-actions">
        <button id="addPageButton" type="button">＋ ページを追加</button>
        <button id="saveBookButton" type="button">文字本を本棚に追加する</button>
      </div>
    </section>
  </main>

  <script>
    const bookTitleInput = document.getElementById("bookTitleInput");
    const pageList = document.getElementById("pageList");
    const addPageButton = document.getElementById("addPageButton");
    const saveBookButton = document.getElementById("saveBookButton");

    const rtlButton = document.getElementById("rtlButton");
    const ltrButton = document.getElementById("ltrButton");

    let pages = [""];
    let direction = "rtl";

    renderPages();

    rtlButton.addEventListener("click", () => {
      direction = "rtl";
      rtlButton.classList.add("active");
      ltrButton.classList.remove("active");
    });

    ltrButton.addEventListener("click", () => {
      direction = "ltr";
      ltrButton.classList.add("active");
      rtlButton.classList.remove("active");
    });

    addPageButton.addEventListener("click", () => {
      saveCurrentText();
      pages.push("");
      renderPages();
    });

    saveBookButton.addEventListener("click", () => {
      saveCurrentText();

      const title = bookTitleInput.value.trim();

      if (!title) {
        alert("本のタイトルを入れてください。");
        return;
      }

      const textPages = pages.map(page => page.trim()).filter(page => page.length > 0);

      if (textPages.length === 0) {
        alert("本文を書いてください。");
        return;
      }

      const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];

      const newBook = {
        id: Date.now().toString(),
        title: title,
        type: "text",
        direction: direction,
        images: [],
        textPages: textPages,
        createdAt: new Date().toLocaleString("ja-JP")
      };

      books.unshift(newBook);
      localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));

      alert("文字本を本棚に追加しました♡");
      window.location.href = "bookshelf.html";
    });

    function renderPages() {
      pageList.innerHTML = "";

      pages.forEach((text, index) => {
        const page = document.createElement("div");
        page.className = "page-editor";

        page.innerHTML = `
          <div class="page-editor-header">
            <div class="page-label">PAGE ${index + 1}</div>
            <button class="small-button" data-delete="${index}" type="button">このページを消す</button>
          </div>

          <textarea data-page="${index}" placeholder="ここに${index + 1}ページ目の本文を書く">${escapeHtml(text)}</textarea>
        `;

        pageList.appendChild(page);
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-delete"));

          if (pages.length === 1) {
            alert("ページは最低1つ必要です。");
            return;
          }

          saveCurrentText();
          pages.splice(index, 1);
          renderPages();
        });
      });
    }

    function saveCurrentText() {
      document.querySelectorAll("[data-page]").forEach((textarea) => {
        const index = Number(textarea.getAttribute("data-page"));
        pages[index] = textarea.value;
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
