<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Book - Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(900px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 30px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .back-button {
      text-decoration: none;
      display: inline-block;
      margin-bottom: 24px;
      padding: 12px 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-weight: bold;
    }

    .choice-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .choice-card {
      text-decoration: none;
      color: #7a1456;
      min-height: 260px;
      padding: 28px 20px;
      border-radius: 30px;
      border: 3px solid #fff;
      background:
        radial-gradient(circle at top left, #fff, transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,170,225,0.82));
      box-shadow:
        0 12px 0 #d95aa9,
        0 0 24px rgba(255, 105, 210, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .choice-card:hover {
      transform: translateY(-6px) rotate(-1deg);
      box-shadow:
        0 16px 0 #d95aa9,
        0 0 32px rgba(255, 105, 210, 0.75);
    }

    .icon {
      font-size: 56px;
      margin-bottom: 18px;
    }

    .choice-title {
      font-size: 24px;
      color: #fff;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 16px #ff4fc3;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .choice-text {
      font-size: 14px;
      line-height: 1.8;
      color: #8c1d63;
      font-weight: bold;
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
      margin-top: 26px;
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Create Book</h1>
      <p class="subtitle">今日はどの気分？♡</p>
    </header>

    <section class="panel">
      <a class="back-button" href="index.html">← 本棚に戻る</a>

      <div class="choice-area">
        <a class="choice-card" href="create-image.html">
          <div class="icon">🖼️</div>
          <div class="choice-title">画像で作る</div>
          <div class="choice-text">
            イラスト、漫画、写真ログ<br />
            画像を追加した順番で<br />
            ページになります。
          </div>
        </a>

        <a class="choice-card" href="create-text.html">
          <div class="icon">✍️</div>
          <div class="choice-title">文字で作る</div>
          <div class="choice-text">
            小説ログ、文章まとめ<br />
            ページごとに本文を編集して<br />
            本にできます。
          </div>
        </a>
      </div>

      <p class="hint">
        画像か文字を選んだあと、それぞれ専用の作成画面に移動します。
      </p>
    </section>
  </main>
</body>
</html>
