<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Image Book</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1000px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 24px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 28px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255,105,210,0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button,
    button,
    .upload-label {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255,141,221,0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    input[type="text"] {
      width: min(560px, 90vw);
      padding: 15px 18px;
      border-radius: 999px;
      border: 2px solid #fff;
      background: rgba(255,255,255,0.78);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-size: 15px;
      outline: none;
      box-shadow: inset 0 0 12px rgba(255,141,221,0.5);
      margin: 10px 0;
      text-align: center;
    }

    .choice-box {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 14px 0;
    }

    .choice-card {
      cursor: pointer;
      width: 170px;
      padding: 14px;
      border-radius: 22px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.55);
      box-shadow:
        0 7px 0 #d95aa9,
        0 0 16px rgba(255,141,221,0.7);
      font-weight: bold;
      text-align: center;
    }

    .choice-card.active {
      background: linear-gradient(135deg, #fff, #ff9bdf);
      transform: translateY(-3px);
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .preview {
      border-radius: 24px;
      border: 3px solid #fff;
      background: rgba(255,255,255,0.62);
      overflow: hidden;
      box-shadow:
        0 8px 0 #d95aa9,
        0 0 18px rgba(122,20,86,0.18);
      padding: 12px;
      text-align: center;
    }

    .preview img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      display: block;
      background: rgba(255,255,255,0.8);
      border-radius: 16px;
      border: 2px solid #fff;
    }

    .preview-number {
      display: inline-block;
      margin: 10px 0 8px;
      background: rgba(255,255,255,0.85);
      color: #b13a86;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .image-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .image-actions .card-button {
      width: 100%;
      margin: 0;
      padding: 9px 6px;
      border-radius: 14px;
      font-size: 12px;
      box-shadow:
        0 3px 0 #d95aa9,
        0 0 10px rgba(255,141,221,0.9);
    }

    .image-actions .danger-button {
      grid-column: 1 / -1;
      background: linear-gradient(180deg, #ffffff, #ff7bbb);
    }

    @media (max-width: 700px) {
      .app {
        width: 96vw;
        padding: 24px 0 40px;
      }

      .panel {
        padding: 18px;
      }

      a.button,
      button,
      .upload-label {
        width: 100%;
      }

      .choice-card {
        width: 100%;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }

      .preview img {
        height: 240px;
      }

      .image-actions {
        grid-template-columns: 1fr 1fr;
      }

      .image-actions .card-button {
        width: 100%;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1>Image Book</h1>
      <p class="subtitle">画像ごとに圧縮・削除・順番変更できます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="create.html">← 種類選択に戻る</a>
      <a class="button" href="bookshelf.html">本棚に戻る</a>

      <div>
        <input id="bookTitleInput" type="text" placeholder="本のタイトル" />
      </div>

      <div>
        <input id="bookDateInput" type="text" placeholder="日付 例：2026.6.9 / 2026年6月9日" />
      </div>

      <p class="hint">開き方を選んでください。</p>

      <div class="choice-box">
        <div id="rtlButton" class="choice-card active">右開き</div>
        <div id="ltrButton" class="choice-card">左開き</div>
      </div>

      <label class="upload-label" for="imageInput">画像を選ぶ</label>
      <input id="imageInput" type="file" accept="image/*" multiple />

      <p id="selectedInfo" class="hint">まだ画像が選ばれていません。</p>

      <button id="saveBookButton" type="button">画像本を本棚に追加する</button>

      <div id="previewGrid" class="preview-grid"></div>
    </section>
  </main>

  <script>
    const bookTitleInput = document.getElementById("bookTitleInput");
    const bookDateInput = document.getElementById("bookDateInput");
    const imageInput = document.getElementById("imageInput");
    const selectedInfo = document.getElementById("selectedInfo");
    const saveBookButton = document.getElementById("saveBookButton");
    const previewGrid = document.getElementById("previewGrid");

    const rtlButton = document.getElementById("rtlButton");
    const ltrButton = document.getElementById("ltrButton");

    let selectedImages = [];
    let direction = "rtl";

    rtlButton.addEventListener("click", () => {
      direction = "rtl";
      rtlButton.classList.add("active");
      ltrButton.classList.remove("active");
    });

    ltrButton.addEventListener("click", () => {
      direction = "ltr";
      ltrButton.classList.add("active");
      rtlButton.classList.remove("active");
    });

    imageInput.addEventListener("change", async (event) => {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      selectedInfo.textContent = "画像を読み込んでいます...";

      try {
        const addedImages = [];

        for (const file of files) {
          const image = await fileToDataUrl(file);
          addedImages.push(image);
        }

        selectedImages = selectedImages.concat(addedImages);
        imageInput.value = "";
        renderPreview();
      } catch (error) {
        console.error(error);
        alert("画像の読み込みに失敗しました。別の画像で試してください。");
        renderPreview();
      }
    });

    saveBookButton.addEventListener("click", () => {
      const title = bookTitleInput.value.trim();
      const bookDate = bookDateInput.value.trim();

      if (!title) {
        alert("本のタイトルを入れてください。");
        return;
      }

      if (!bookDate) {
        alert("日付を入れてください。");
        return;
      }

      if (selectedImages.length === 0) {
        alert("画像を選んでください。");
        return;
      }

      saveBookButton.disabled = true;
      saveBookButton.textContent = "保存中...";

      try {
        const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];

        const newBook = {
          id: Date.now().toString(),
          title: title,
          bookDate: bookDate,
          type: "image",
          direction: direction,
          images: selectedImages,
          textPages: [],
          createdAt: new Date().toLocaleString("ja-JP")
        };

        books.unshift(newBook);
        localStorage.setItem("pinkFlipbookBooks", JSON.stringify(books));

        alert("画像本を本棚に追加しました♡");
        window.location.href = "bookshelf.html";
      } catch (error) {
        console.error(error);

        alert(
          "保存できませんでした。\n" +
          "画像が大きすぎるか、枚数が多すぎる可能性があります。\n" +
          "各画像の「軽く圧縮」か「もっと圧縮」を押してから、もう一度保存してください。"
        );

        saveBookButton.disabled = false;
        saveBookButton.textContent = "画像本を本棚に追加する";
      }
    });

    function renderPreview() {
      previewGrid.innerHTML = "";

      if (selectedImages.length === 0) {
        selectedInfo.textContent = "まだ画像が選ばれていません。";
        return;
      }

      selectedInfo.textContent = selectedImages.length + "枚の画像を選びました。";

      selectedImages.forEach((src, index) => {
        const item = document.createElement("div");
        item.className = "preview";

        item.innerHTML = `
          <img src="${src}" alt="preview ${index + 1}" />
          <div class="preview-number">PAGE ${index + 1}</div>

          <div class="image-actions">
            <button class="card-button" data-compress-light="${index}" type="button">軽く圧縮</button>
            <button class="card-button" data-compress-strong="${index}" type="button">もっと圧縮</button>
            <button class="card-button" data-up="${index}" type="button">前へ</button>
            <button class="card-button" data-down="${index}" type="button">後ろへ</button>
            <button class="card-button danger-button" data-delete="${index}" type="button">消す</button>
          </div>
        `;

        previewGrid.appendChild(item);
      });

      document.querySelectorAll("[data-delete]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-delete"));
          selectedImages.splice(index, 1);
          renderPreview();
        });
      });

      document.querySelectorAll("[data-up]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-up"));
          moveImage(index, index - 1);
        });
      });

      document.querySelectorAll("[data-down]").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.getAttribute("data-down"));
          moveImage(index, index + 1);
        });
      });

      document.querySelectorAll("[data-compress-light]").forEach((button) => {
        button.addEventListener("click", async () => {
          const index = Number(button.getAttribute("data-compress-light"));
          await compressOneImage(index, 1400, 0.72, button, "軽く圧縮");
        });
      });

      document.querySelectorAll("[data-compress-strong]").forEach((button) => {
        button.addEventListener("click", async () => {
          const index = Number(button.getAttribute("data-compress-strong"));
          await compressOneImage(index, 900, 0.58, button, "もっと圧縮");
        });
      });
    }

    async function compressOneImage(index, maxSize, quality, button, originalText) {
      if (!selectedImages[index]) return;

      button.disabled = true;
      button.textContent = "圧縮中...";

      try {
        selectedImages[index] = await compressDataUrlImage(selectedImages[index], maxSize, quality);
        renderPreview();
      } catch (error) {
        console.error(error);
        alert("画像の圧縮に失敗しました。");
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function moveImage(from, to) {
      if (to < 0 || to >= selectedImages.length) return;

      const item = selectedImages.splice(from, 1)[0];
      selectedImages.splice(to, 0, item);
      renderPreview();
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressDataUrlImage(dataUrl, maxSize = 1400, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxSize) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else if (height >= width && height > maxSize) {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
          resolve(compressedDataUrl);
        };

        img.onerror = reject;
        img.src = dataUrl;
      });
    }
  </script>
</body>
</html>
