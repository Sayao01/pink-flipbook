<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Book - Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
      overflow-x: hidden;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1220px, 96vw);
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    header {
      text-align: center;
      padding: 16px 10px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 64px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 10px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 20px auto;
      padding: 22px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button,
    button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .book-area {
      width: 100%;
      margin: 20px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    #flipbook {
      margin: 0 auto;
      filter: drop-shadow(0 26px 28px rgba(122,20,86,0.35));
    }

    .page {
      background: #fff6fd;
      border: 1px solid #ffd1ef;
      overflow: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      padding: 16px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.96), rgba(255,246,253,1));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .page-content::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.18), transparent 34%, rgba(122,20,86,0.08));
      mix-blend-mode: multiply;
    }

    .page-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(122,20,86,0.20);
      background: white;
      position: relative;
      z-index: 1;
    }

    .novel-page {
      align-items: flex-start;
      justify-content: flex-start;
      padding: 34px 36px;
      color: #5f1747;
      overflow: hidden;
    }

    .novel-text {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 2.1;
      letter-spacing: 0.06em;
      text-align: start;
      white-space: pre-wrap;
      overflow: hidden;
      font-size: 16px;
    }

    .page-number {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 12px;
      color: #b13a86;
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: bold;
      z-index: 2;
    }

    .cover-page .page-content {
      background:
        radial-gradient(circle at top left, #fff, transparent 28%),
        linear-gradient(135deg, #ff8ddd, #fff0fb, #ffc7ed);
      color: #7a1456;
      text-align: center;
      flex-direction: column;
      padding: 26px;
    }

    .cover-title {
      font-size: 34px;
      color: #fff;
      text-shadow:
        0 3px 0 #d95aa9,
        0 0 18px #ff4fc3;
      letter-spacing: 3px;
      line-height: 1.5;
      word-break: break-word;
    }

    .cover-sub {
      margin-top: 18px;
      color: #8c1d63;
      font-weight: bold;
    }

    .blank {
      color: #d678b7;
      font-weight: bold;
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }

    .controls {
      margin-top: 24px;
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .missing {
      padding: 38px 12px;
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      .panel {
        padding: 14px;
      }

      a.button,
      button {
        padding: 11px 18px;
        font-size: 13px;
      }

      .cover-title {
        font-size: 24px;
      }

      .novel-page {
        padding: 28px 24px;
      }

      .novel-text {
        font-size: 14px;
        line-height: 2;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1 id="bookTitle">Pink Flipbook</h1>
      <p id="subtitle" class="subtitle">ページの端をドラッグして、紙みたいにめくれます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="index.html">← 本棚に戻る</a>

      <div id="missingMessage" class="missing" style="display:none;">
        本が見つかりませんでした。<br />
        本棚からもう一度開いてください。
      </div>

      <div id="readerArea">
        <div class="book-area">
          <div id="flipbook"></div>
        </div>

        <div class="controls">
          <button id="prevButton" type="button">← 前へ</button>
          <button id="nextButton" type="button">次へ →</button>
        </div>

        <p id="pageInfo" class="hint"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

  <script>
    const bookTitle = document.getElementById("bookTitle");
    const subtitle = document.getElementById("subtitle");
    const missingMessage = document.getElementById("missingMessage");
    const readerArea = document.getElementById("readerArea");
    const flipbookElement = document.getElementById("flipbook");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];
    const currentBook = books.find((book) => book.id === bookId);

    let pageFlip = null;

    if (!currentBook) {
      bookTitle.textContent = "Not Found";
      missingMessage.style.display = "block";
      readerArea.style.display = "none";
    } else {
      bookTitle.textContent = currentBook.title;

      if (currentBook.type === "text") {
        subtitle.textContent = "縦書きの小説本として読めます♡";
      }

      createFlipbook();
    }

    function createFlipbook() {
      const pages = [];

      pages.push(`
        <div class="page cover-page">
          <div class="page-content">
            <div class="cover-title">${escapeHtml(currentBook.title)}</div>
            <div class="cover-sub">
              ${currentBook.type === "text" ? "Text Book ♡" : "Image Book ♡"}
            </div>
          </div>
        </div>
      `);

      if (currentBook.type === "text") {
        const textPages = currentBook.textPages || [];

        textPages.forEach((text, index) => {
          pages.push(`
            <div class="page">
              <div class="page-content novel-page">
                <div class="novel-text">${escapeHtml(text)}</div>
                <div class="page-number">${index + 1}</div>
              </div>
            </div>
          `);
        });
      } else {
        const images = currentBook.images || [];

        images.forEach((src, index) => {
          pages.push(`
            <div class="page">
              <div class="page-content">
                <img src="${src}" alt="page ${index + 1}" />
                <div class="page-number">${index + 1}</div>
              </div>
            </div>
          `);
        });
      }

      if (pages.length % 2 !== 0) {
        pages.push(`
          <div class="page">
            <div class="page-content">
              <div class="blank">Blank page ♡</div>
            </div>
          </div>
        `);
      }

      flipbookElement.innerHTML = pages.join("");

      pageFlip = new St.PageFlip(flipbookElement, {
        width: 430,
        height: 610,
        size: "stretch",
        minWidth: 300,
        maxWidth: 520,
        minHeight: 430,
        maxHeight: 720,
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: false,
        useMouseEvents: true,
        drawShadow: true,
        maxShadowOpacity: 0.8,
        flippingTime: 1100,
        startZIndex: 10,
        startPage: 0
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      pageFlip.on("flip", () => {
        updateInfo();
      });

      updateInfo();
    }

    prevButton.addEventListener("click", () => {
      if (!pageFlip) return;
      pageFlip.flipPrev();
      setTimeout(updateInfo, 400);
    });

    nextButton.addEventListener("click", () => {
      if (!pageFlip) return;
      pageFlip.flipNext();
      setTimeout(updateInfo, 400);
    });

    function updateInfo() {
      if (!pageFlip) return;

      const current = pageFlip.getCurrentPageIndex();
      const total = pageFlip.getPageCount();

      pageInfo.textContent = `${current + 1} / ${total} pages`;

      prevButton.disabled = current === 0;
      nextButton.disabled = current >= total - 1;
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
