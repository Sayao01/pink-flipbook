<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Book - Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1050px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 20px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 26px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button,
    button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .book-view {
      width: min(920px, 95vw);
      margin: 20px auto 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      perspective: 1600px;
      filter: drop-shadow(0 24px 30px rgba(122,20,86,0.35));
    }

    .page {
      min-height: 560px;
      background: #fff6fd;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .page.left {
      border-radius: 28px 0 0 28px;
      border-right: 1px solid #efb3dc;
      box-shadow: inset -16px 0 22px rgba(122, 20, 86, 0.12);
    }

    .page.right {
      border-radius: 0 28px 28px 0;
      border-left: 1px solid #efb3dc;
      box-shadow: inset 16px 0 22px rgba(122, 20, 86, 0.12);
    }

    .page img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(122, 20, 86, 0.22);
      background: #fff;
    }

    .page-number {
      position: absolute;
      bottom: 12px;
      font-size: 13px;
      color: #b13a86;
      font-weight: bold;
    }

    .empty-page {
      color: #d678b7;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
    }

    .controls {
      margin-top: 24px;
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .turning-right {
      animation: turnRight 0.45s ease;
    }

    .turning-left {
      animation: turnLeft 0.45s ease;
    }

    @keyframes turnRight {
      from {
        transform: rotateY(0deg);
        opacity: 0.75;
      }
      to {
        transform: rotateY(-8deg);
        opacity: 1;
      }
    }

    @keyframes turnLeft {
      from {
        transform: rotateY(0deg);
        opacity: 0.75;
      }
      to {
        transform: rotateY(8deg);
        opacity: 1;
      }
    }

    .missing {
      padding: 38px 12px;
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      .book-view {
        grid-template-columns: 1fr;
      }

      .page.left {
        display: none;
      }

      .page.right {
        border-radius: 28px;
      }

      .page {
        min-height: 480px;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1 id="bookTitle">Pink Flipbook</h1>
      <p class="subtitle">ページをめくって読めます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="index.html">← 本棚に戻る</a>

      <div id="missingMessage" class="missing" style="display:none;">
        本が見つかりませんでした。<br />
        本棚からもう一度開いてください。
      </div>

      <div id="readerArea">
        <div id="bookView" class="book-view">
          <div class="page left" id="leftPage">
            <div class="empty-page">左ページ</div>
          </div>
          <div class="page right" id="rightPage">
            <div class="empty-page">右ページ</div>
          </div>
        </div>

        <div class="controls">
          <button id="prevButton" type="button">← 前のページ</button>
          <button id="nextButton" type="button">次のページ →</button>
        </div>

        <p id="pageInfo" class="hint"></p>
      </div>
    </section>
  </main>

  <script>
    const bookTitle = document.getElementById("bookTitle");
    const missingMessage = document.getElementById("missingMessage");
    const readerArea = document.getElementById("readerArea");

    const bookView = document.getElementById("bookView");
    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];
    const currentBook = books.find((book) => book.id === bookId);

    let currentSpread = 0;

    if (!currentBook) {
      bookTitle.textContent = "Not Found";
      missingMessage.style.display = "block";
      readerArea.style.display = "none";
    } else {
      bookTitle.textContent = currentBook.title;
      renderCurrentBook();
    }

    prevButton.addEventListener("click", () => {
      if (currentSpread > 0) {
        currentSpread--;
        animateBook("turning-left");
        renderCurrentBook();
      }
    });

    nextButton.addEventListener("click", () => {
      if (!currentBook) return;

      const maxSpread = Math.ceil(currentBook.images.length / 2) - 1;

      if (currentSpread < maxSpread) {
        currentSpread++;
        animateBook("turning-right");
        renderCurrentBook();
      }
    });

    function renderCurrentBook() {
      if (!currentBook) return;

      const leftIndex = currentSpread * 2;
      const rightIndex = leftIndex + 1;

      leftPage.innerHTML = createPageContent(currentBook.images[leftIndex], leftIndex);
      rightPage.innerHTML = createPageContent(currentBook.images[rightIndex], rightIndex);

      const maxSpread = Math.ceil(currentBook.images.length / 2) - 1;

      prevButton.disabled = currentSpread === 0;
      nextButton.disabled = currentSpread === maxSpread;

      pageInfo.textContent = `${currentSpread + 1} / ${maxSpread + 1} 見開き`;
    }

    function createPageContent(src, index) {
      if (!src) {
        return `<div class="empty-page">Blank page ♡</div>`;
      }

      return `
        <img src="${src}" alt="page ${index + 1}" />
        <div class="page-number">${index + 1}</div>
      `;
    }

    function animateBook(className) {
      bookView.classList.remove("turning-right", "turning-left");
      void bookView.offsetWidth;
      bookView.classList.add(className);
    }
  </script>
</body>
</html>
