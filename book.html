<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read Book - Pink Flipbook</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DotGothic16", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0fb, transparent 28%),
        radial-gradient(circle at bottom right, #ff8bdd, transparent 30%),
        linear-gradient(135deg, #ffb6e6, #ffd6f6, #ffeafc);
      color: #7a1456;
    }

    .sparkle {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.95) 0 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 2px);
      background-size: 90px 90px, 50px 50px;
      animation: glitter 8s linear infinite;
      opacity: 0.65;
      z-index: 0;
    }

    @keyframes glitter {
      from { transform: translateY(0); }
      to { transform: translateY(-80px); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1050px, 94vw);
      margin: 0 auto;
      padding: 36px 0 60px;
    }

    header {
      text-align: center;
      padding: 20px 10px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 70px);
      margin: 0;
      color: #fff;
      letter-spacing: 5px;
      text-shadow:
        0 4px 0 #d95aa9,
        0 0 18px #ff4fc3,
        0 0 36px #fff;
      word-break: break-word;
    }

    .subtitle {
      margin-top: 12px;
      color: #8c1d63;
      font-weight: bold;
      line-height: 1.7;
    }

    .panel {
      margin: 24px auto;
      padding: 26px;
      border-radius: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.46);
      box-shadow:
        0 0 30px rgba(255, 105, 210, 0.45),
        inset 0 0 18px rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      text-align: center;
    }

    a.button,
    button {
      text-decoration: none;
      display: inline-block;
      cursor: pointer;
      margin: 8px;
      padding: 13px 24px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff, #ff9bdf);
      border: 2px solid #fff;
      box-shadow:
        0 6px 0 #d95aa9,
        0 0 18px rgba(255, 141, 221, 0.9);
      color: #7a1456;
      font-family: "DotGothic16", sans-serif;
      font-weight: bold;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .book-stage {
      position: relative;
      width: min(920px, 95vw);
      margin: 20px auto 0;
      perspective: 2200px;
      filter: drop-shadow(0 24px 30px rgba(122,20,86,0.35));
    }

    .book-view {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      transform-style: preserve-3d;
    }

    .page {
      min-height: 560px;
      background: #fff6fd;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .page.left {
      border-radius: 28px 0 0 28px;
      border-right: 1px solid #efb3dc;
      box-shadow:
        inset -18px 0 24px rgba(122, 20, 86, 0.16),
        inset 0 0 24px rgba(255,255,255,0.8);
    }

    .page.right {
      border-radius: 0 28px 28px 0;
      border-left: 1px solid #efb3dc;
      box-shadow:
        inset 18px 0 24px rgba(122, 20, 86, 0.14),
        inset 0 0 24px rgba(255,255,255,0.8);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.18), transparent 26%, rgba(122,20,86,0.06));
      mix-blend-mode: multiply;
    }

    .page img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(122, 20, 86, 0.22);
      background: #fff;
      position: relative;
      z-index: 1;
    }

    .page-number {
      position: absolute;
      bottom: 12px;
      font-size: 13px;
      color: #b13a86;
      font-weight: bold;
      z-index: 2;
    }

    .empty-page {
      color: #d678b7;
      font-weight: bold;
      text-align: center;
      line-height: 1.8;
      z-index: 1;
    }

    .flipper {
      position: absolute;
      top: 0;
      width: 50%;
      min-height: 560px;
      background: #fff6fd;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: hidden;
      z-index: 10;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      box-shadow: 0 20px 36px rgba(122,20,86,0.28);
      pointer-events: none;
    }

    .flipper img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(122, 20, 86, 0.22);
      background: #fff;
    }

    .flipper.next {
      left: 50%;
      border-radius: 0 28px 28px 0;
      transform-origin: left center;
      animation: flipNext 0.75s ease-in-out forwards;
    }

    .flipper.prev {
      left: 0;
      border-radius: 28px 0 0 28px;
      transform-origin: right center;
      animation: flipPrev 0.75s ease-in-out forwards;
    }

    .flipper::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.25), transparent 35%, rgba(122,20,86,0.18));
      pointer-events: none;
    }

    @keyframes flipNext {
      0% {
        transform: rotateY(0deg);
      }
      45% {
        box-shadow: -18px 18px 32px rgba(122,20,86,0.32);
      }
      100% {
        transform: rotateY(-180deg);
      }
    }

    @keyframes flipPrev {
      0% {
        transform: rotateY(0deg);
      }
      45% {
        box-shadow: 18px 18px 32px rgba(122,20,86,0.32);
      }
      100% {
        transform: rotateY(180deg);
      }
    }

    .controls {
      margin-top: 24px;
    }

    .hint {
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.8;
      font-size: 14px;
    }

    .missing {
      padding: 38px 12px;
      color: #9d2a72;
      font-weight: bold;
      line-height: 1.9;
    }

    @media (max-width: 700px) {
      .book-view {
        grid-template-columns: 1fr;
      }

      .page.left {
        display: none;
      }

      .page.right {
        border-radius: 28px;
      }

      .page {
        min-height: 480px;
      }

      .book-stage {
        perspective: 1600px;
      }

      .flipper {
        width: 100%;
        left: 0 !important;
        min-height: 480px;
        border-radius: 28px;
        transform-origin: left center;
      }

      .flipper.prev {
        transform-origin: right center;
      }

      .panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle"></div>

  <main class="app">
    <header>
      <h1 id="bookTitle">Pink Flipbook</h1>
      <p class="subtitle">ページをぺらっとめくって読めます♡</p>
    </header>

    <section class="panel">
      <a class="button" href="index.html">← 本棚に戻る</a>

      <div id="missingMessage" class="missing" style="display:none;">
        本が見つかりませんでした。<br />
        本棚からもう一度開いてください。
      </div>

      <div id="readerArea">
        <div class="book-stage" id="bookStage">
          <div id="bookView" class="book-view">
            <div class="page left" id="leftPage">
              <div class="empty-page">左ページ</div>
            </div>
            <div class="page right" id="rightPage">
              <div class="empty-page">右ページ</div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="prevButton" type="button">← 前のページ</button>
          <button id="nextButton" type="button">次のページ →</button>
        </div>

        <p id="pageInfo" class="hint"></p>
      </div>
    </section>
  </main>

  <script>
    const bookTitle = document.getElementById("bookTitle");
    const missingMessage = document.getElementById("missingMessage");
    const readerArea = document.getElementById("readerArea");

    const bookStage = document.getElementById("bookStage");
    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageInfo = document.getElementById("pageInfo");

    const params = new URLSearchParams(window.location.search);
    const bookId = params.get("id");

    const books = JSON.parse(localStorage.getItem("pinkFlipbookBooks")) || [];
    const currentBook = books.find((book) => book.id === bookId);

    let currentSpread = 0;
    let isTurning = false;

    if (!currentBook) {
      bookTitle.textContent = "Not Found";
      missingMessage.style.display = "block";
      readerArea.style.display = "none";
    } else {
      bookTitle.textContent = currentBook.title;
      renderCurrentBook();
    }

    prevButton.addEventListener("click", () => {
      if (!currentBook || isTurning || currentSpread === 0) return;

      turnPage("prev");
    });

    nextButton.addEventListener("click", () => {
      if (!currentBook || isTurning) return;

      const maxSpread = Math.ceil(currentBook.images.length / 2) - 1;
      if (currentSpread >= maxSpread) return;

      turnPage("next");
    });

    function turnPage(direction) {
      isTurning = true;
      updateButtons();

      const flip = document.createElement("div");
      flip.className = "flipper " + direction;

      if (direction === "next") {
        const rightIndex = currentSpread * 2 + 1;
        flip.innerHTML = createPageContent(currentBook.images[rightIndex], rightIndex);
      } else {
        const leftIndex = currentSpread * 2;
        flip.innerHTML = createPageContent(currentBook.images[leftIndex], leftIndex);
      }

      bookStage.appendChild(flip);

      setTimeout(() => {
        if (direction === "next") {
          currentSpread++;
        } else {
          currentSpread--;
        }

        renderCurrentBook();
        flip.remove();
        isTurning = false;
        updateButtons();
      }, 760);
    }

    function renderCurrentBook() {
      if (!currentBook) return;

      const leftIndex = currentSpread * 2;
      const rightIndex = leftIndex + 1;

      leftPage.innerHTML = createPageContent(currentBook.images[leftIndex], leftIndex);
      rightPage.innerHTML = createPageContent(currentBook.images[rightIndex], rightIndex);

      const maxSpread = Math.ceil(currentBook.images.length / 2) - 1;
      pageInfo.textContent = `${currentSpread + 1} / ${maxSpread + 1} 見開き`;

      updateButtons();
    }

    function updateButtons() {
      if (!currentBook) return;

      const maxSpread = Math.ceil(currentBook.images.length / 2) - 1;

      prevButton.disabled = isTurning || currentSpread === 0;
      nextButton.disabled = isTurning || currentSpread === maxSpread;
    }

    function createPageContent(src, index) {
      if (!src) {
        return `<div class="empty-page">Blank page ♡</div>`;
      }

      return `
        <img src="${src}" alt="page ${index + 1}" />
        <div class="page-number">${index + 1}</div>
      `;
    }
  </script>
</body>
</html>
